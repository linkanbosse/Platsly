name: Build Platsly

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: platsly-build
          path: |
            dist
            .output
          if-no-files-found: ignore
